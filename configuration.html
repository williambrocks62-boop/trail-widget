<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Configuration de mon objectif</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 30px 20px;
  font-family: Arial, sans-serif;
  background: #EDE8E0;
  color: #29251F;
}

.container {
  max-width: 620px;
  margin: auto;
  background: white;
  padding: 30px;
  border-radius: 16px;
}

h1 {
  margin: 0 0 8px 0;
  font-size: 24px;
}

.intro {
  color: #817A70;
  font-size: 14px;
  line-height: 1.5;
  margin-bottom: 28px;
}

label {
  display: block;
  margin-top: 18px;
  margin-bottom: 6px;
  font-size: 14px;
  font-weight: 600;
}

input {
  width: 100%;
  padding: 11px 12px;
  border: 1px solid #D8D1C7;
  border-radius: 8px;
  font-size: 15px;
  font-family: inherit;
}

input:focus {
  outline: none;
  border-color: #8B6F47;
}

button {
  width: 100%;
  margin-top: 25px;
  padding: 13px;
  border: none;
  border-radius: 8px;
  background: #8B6F47;
  color: white;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
}

button:hover {
  opacity: 0.9;
}

.erreur {
  display: none;
  margin-top: 15px;
  padding: 12px;
  border-radius: 8px;
  background: #F5E4E0;
  color: #8A4034;
  font-size: 13px;
}

.apercu {
  display: none;
  margin-top: 25px;
  padding: 18px;
  border-radius: 10px;
  background: #EDE8E0;
}

.apercu-titre {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 8px;
}

.apercu-details {
  font-size: 13px;
  color: #817A70;
}

.apercu-dates {
  margin-top: 10px;
  font-size: 13px;
  color: #817A70;
}

.resultat {
  display: none;
  margin-top: 25px;
  padding: 18px;
  background: #F2EFEA;
  border-radius: 10px;
}

.resultat-titre {
  font-weight: 700;
  margin-bottom: 8px;
}

.resultat p {
  font-size: 13px;
  color: #817A70;
  line-height: 1.5;
}

.url {
  word-break: break-all;
  font-size: 12px;
  background: white;
  padding: 10px;
  border-radius: 6px;
  border: 1px solid #D8D1C7;
}

.bouton-secondaire {
  background: #29251F;
}

</style>

</head>


<body>

<div class="container">

<h1>Configurer mon objectif</h1>

<div class="intro">
Renseigne les informations de ta course pour générer ton widget de progression.
</div>


<label for="course">
Nom de l'objectif
</label>

<input
  type="text"
  id="course"
  placeholder="Ex : Tour des Glaciers de la Vanoise"
>


<label for="distance">
Distance (km)
</label>

<input
  type="number"
  id="distance"
  placeholder="Ex : 73"
  min="1"
>


<label for="dplus">
D+ (m)
</label>

<input
  type="number"
  id="dplus"
  placeholder="Ex : 3800"
  min="0"
>


<label for="dmoins">
D- (m)
</label>

<input
  type="number"
  id="dmoins"
  placeholder="Ex : 3800"
  min="0"
>


<label for="debut">
Début de préparation
</label>

<input
  type="date"
  id="debut"
>


<label for="objectif">
Date de course
</label>

<input
  type="date"
  id="objectif"
>


<div class="erreur" id="erreur"></div>


<button onclick="genererWidget()">
Générer mon widget
</button>


<div class="apercu" id="apercu">

  <div class="apercu-titre" id="apercu-titre"></div>

  <div class="apercu-details" id="apercu-details"></div>

  <div class="apercu-dates" id="apercu-dates"></div>

</div>


<div class="resultat" id="resultat">

  <div class="resultat-titre">
  ✅ Ton widget est prêt
  </div>

  <p>
  Copie le lien ci-dessous et utilise-le dans Notion avec la fonction /embed.
  </p>

  <div class="url" id="url"></div>

  <button
    class="bouton-secondaire"
    onclick="copierURL()"
  >
  📋 Copier le lien
  </button>

</div>


</div>


<script>

const SUPABASE_URL = "https://qogovmyyjjjukxmqumtl.supabase.co";

const SUPABASE_KEY = "sb_publishable_PO9CHcn3ke4VQyqQszCMcg_Csc-x2e_";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


async function genererWidget() {

  const course =
    document.getElementById("course").value.trim();

  const distance =
    document.getElementById("distance").value;

  const dplus =
    document.getElementById("dplus").value;

  const dmoins =
    document.getElementById("dmoins").value;

  const debut =
    document.getElementById("debut").value;

  const objectif =
    document.getElementById("objectif").value;


  const erreur =
    document.getElementById("erreur");

  erreur.style.display = "none";


  // Vérification des champs

  if (
    !course ||
    !distance ||
    !dplus ||
    !dmoins ||
    !debut ||
    !objectif
  ) {

    erreur.textContent =
      "Merci de remplir tous les champs.";

    erreur.style.display = "block";

    return;
  }


  // Vérification de la distance

  if (Number(distance) <= 0) {

    erreur.textContent =
      "La distance doit être supérieure à 0.";

    erreur.style.display = "block";

    return;
  }


  // Vérification des dates

  const dateDebut =
    new Date(debut + "T00:00:00");

  const dateObjectif =
    new Date(objectif + "T00:00:00");


  if (dateObjectif <= dateDebut) {

    erreur.textContent =
      "La date de course doit être postérieure au début de préparation.";

    erreur.style.display = "block";

    return;
  }


  // Enregistrement dans Supabase

  const { data, error } = await supabaseClient

    .from("objectifs")

    .insert([
      {
        course: course,
        distance: Number(distance),
        dplus: Number(dplus),
        dmoins: Number(dmoins),
        date_debut: debut,
        date_objectif: objectif
      }
    ])

    .select()

    .single();


  // Gestion de l'erreur Supabase

  if (error) {

    console.error(
      "Erreur Supabase :",
      error
    );

    erreur.textContent =
      "Impossible d'enregistrer l'objectif. Vérifie la console.";

    erreur.style.display = "block";

    return;
  }


  // Affichage de l'aperçu

  document.getElementById("apercu-titre")
    .textContent = course;


  document.getElementById("apercu-details")
    .textContent =
      distance + " km · " +
      Number(dplus).toLocaleString("fr-FR") +
      " m D+ · " +
      Number(dmoins).toLocaleString("fr-FR") +
      " m D-";


  document.getElementById("apercu-dates")
    .textContent =
      "Préparation : " +
      dateDebut.toLocaleDateString("fr-FR") +
      " → " +
      dateObjectif.toLocaleDateString("fr-FR");


  document.getElementById("apercu")
    .style.display = "block";


  // Création du lien permanent

  const baseURL =
    window.location.origin +
    window.location.pathname.replace(
      "configuration.html",
      ""
    );


  const url =
    baseURL +
    "index.html?id=" +
    data.id;


  document.getElementById("url")
    .textContent = url;


  document.getElementById("resultat")
    .style.display = "block";


  console.log(
    "Objectif créé :",
    data
  );

}


function copierURL() {

  const url =
    document.getElementById("url").textContent;

  navigator.clipboard.writeText(url);

  alert("Lien copié !");

}

</script>


</body>

</html>
