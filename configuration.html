<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Configuration de mon objectif</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 30px 20px;
  font-family: Arial, sans-serif;
  background: #EDE8E0;
  color: #29251F;
}

.container {
  max-width: 600px;
  margin: auto;
  background: white;
  padding: 30px;
  border-radius: 16px;
}

h1 {
  margin-top: 0;
  font-size: 24px;
}

.intro {
  color: #817A70;
  font-size: 14px;
  margin-bottom: 25px;
}

label {
  display: block;
  margin-top: 18px;
  margin-bottom: 6px;
  font-size: 14px;
  font-weight: 600;
}

input {
  width: 100%;
  padding: 11px 12px;
  border: 1px solid #D8D1C7;
  border-radius: 8px;
  font-size: 15px;
}

button {
  width: 100%;
  margin-top: 25px;
  padding: 13px;
  border: none;
  border-radius: 8px;
  background: #8B6F47;
  color: white;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
}

button:hover {
  opacity: 0.9;
}

.resultat {
  display: none;
  margin-top: 25px;
  padding: 15px;
  background: #EDE8E0;
  border-radius: 8px;
}

.resultat p {
  font-size: 13px;
  color: #817A70;
}

.url {
  word-break: break-all;
  font-size: 12px;
  background: white;
  padding: 10px;
  border-radius: 6px;
}
</style>
</head>

<body>

<div class="container">

  <h1>Configurer mon objectif</h1>

  <div class="intro">
    Renseigne les informations de ta course pour générer ton widget de progression.
  </div>

  <label for="course">Nom de l'objectif</label>
  <input type="text" id="course" placeholder="Ex : Tour des Glaciers de la Vanoise">

  <label for="distance">Distance (km)</label>
  <input type="number" id="distance" placeholder="Ex : 73">

  <label for="dplus">D+ (m)</label>
  <input type="number" id="dplus" placeholder="Ex : 3800">

  <label for="dmoins">D- (m)</label>
  <input type="number" id="dmoins" placeholder="Ex : 3800">

  <label for="debut">Début de préparation</label>
  <input type="date" id="debut">

  <label for="objectif">Date de course</label>
  <input type="date" id="objectif">

  <button onclick="genererWidget()">
    Générer mon widget
  </button>

  <div class="resultat" id="resultat">

    <strong>Ton widget est prêt 🎉</strong>

    <p>
      Copie ce lien et utilise-le dans Notion avec /embed.
    </p>

    <div class="url" id="url"></div>

    <button onclick="copierURL()">
      Copier le lien
    </button>

  </div>

</div>

<script>

const params = new URLSearchParams(window.location.search);

const objectif = {
  titre: params.get("course") || "Tour des Glaciers de la Vanoise",
  distance: params.get("distance") || "73",
  dplus: params.get("dplus") || "3800",
  dmoins: params.get("dmoins") || "3800",
  dateDebut: params.get("debut") || "2026-11-02",
  dateObjectif: params.get("objectif") || "2027-07-04"
};


// Affichage des informations de la course

document.querySelector(".titre").textContent = objectif.titre;

document.querySelector(".details").innerHTML = `
  <span>${objectif.distance} km</span>
  <span>${Number(objectif.dplus).toLocaleString("fr-FR")} m D+</span>
  <span>${Number(objectif.dmoins).toLocaleString("fr-FR")} m D-</span>
`;


// Calcul de la progression

function calculerProgression() {

  const maintenant = new Date();

  const debut = new Date(objectif.dateDebut + "T00:00:00");

  const objectifDate = new Date(objectif.dateObjectif + "T00:00:00");

  const dureeTotale = objectifDate.getTime() - debut.getTime();

  const tempsEcoule = maintenant.getTime() - debut.getTime();

  let progression = (tempsEcoule / dureeTotale) * 100;

  progression = Math.min(Math.max(progression, 0), 100);

  return progression;
}


// Calcul du temps restant

function calculerTempsRestant() {

  const maintenant = new Date();

  const objectifDate = new Date(objectif.dateObjectif + "T00:00:00");

  const difference = objectifDate.getTime() - maintenant.getTime();

  if (difference <= 0) {
    return "Objectif atteint";
  }

  const jours = Math.ceil(
    difference / (1000 * 60 * 60 * 24)
  );

  if (jours < 30) {
    return jours + (jours > 1 ? " jours restants" : " jour restant");
  }

  const mois = Math.floor(jours / 30);

  const joursRestants = jours % 30;

  if (joursRestants === 0) {
    return mois + (mois > 1 ? " mois restants" : " mois restant");
  }

  return mois + " mois · " +
         joursRestants +
         (joursRestants > 1 ? " jours restants" : " jour restant");
}


// Mise à jour du widget

function mettreAJour() {

  const progression = calculerProgression();

  document.getElementById("pourcentage").textContent =
    Math.round(progression) + "%";

  document.getElementById("barre").style.width =
    progression + "%";

  document.getElementById("temps-restant").textContent =
    calculerTempsRestant();
}


mettreAJour();

setInterval(mettreAJour, 60 * 60 * 1000);

</script>

</body>
</html>
